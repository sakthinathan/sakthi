services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./utsavops.db}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-utsavops-dev-secret-key-32-chars-long!}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - FLAGSMITH_ENVIRONMENT_KEY=${FLAGSMITH_ENVIRONMENT_KEY:-}
      - FLAGSMITH_ADMIN_API_KEY=${FLAGSMITH_ADMIN_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/utsavops.db:/app/utsavops.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
