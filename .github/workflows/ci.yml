name: UtsavOps CI

on:
  push:
    branches: [ main, "feature/*", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify no live API tokens or credentials in tracked files
        run: |
          echo "Scanning tracked repository files for exposed credentials..."
          ! git grep -E "(8coM1k1z|P71EA9Yr|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE)" $(git ls-files | grep -v '^\.github/workflows/ci\.yml')

  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: utsavops_test
          POSTGRES_USER: utsavops_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-asyncio httpx flagsmith

      - name: Run Backend Pytest Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///./test_utsavops.db
          AUTH_SECRET_KEY: test-auth-secret-key-32-chars-minimum-required!
          INITIAL_ADMIN_PASSWORD: ci-test-fixture-admin-password-2026!
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (clean reproducible install)
        run: |
          cd frontend
          npm ci

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
