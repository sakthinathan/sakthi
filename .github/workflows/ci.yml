name: UtsavOps CI

on:
  push:
    branches: [ main, "feature/*", "feature/**", "fix/*", "fix/**", "chore/*", "chore/**" ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret & Credential Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with history for PR/commit diff scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Scan all tracked working tree files (secrets masked)
        run: |
          gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose

      - name: Scan commit / PR diff (secrets masked)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning commit range: ${RANGE}"
          gitleaks detect --source . --log-opts="${RANGE}" --config .gitleaks.toml --redact --verbose

  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: utsavops_test
          POSTGRES_USER: utsavops_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Run Backend Pytest Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///./test_utsavops.db
          AUTH_SECRET_KEY: test-auth-secret-key-32-chars-minimum-required!
          INITIAL_ADMIN_PASSWORD: ci-test-fixture-admin-password-2026!
        run: |
          cd backend
          PYTHONPATH=. python -m pytest tests/ -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (clean reproducible install)
        run: |
          cd frontend
          npm ci

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
