# =============================================================================
# DEMO FIXTURE: Simulated utsavops-checkout workload for Kubernetes cluster demonstration.
# NOTE: The embedded lightweight python HTTP server is an isolated demo fixture
# designed for k3s pod readiness/liveness testing. It must NOT be presented as
# proof that the live production commerce checkout container is running or healthy.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utsavops-checkout
  namespace: utsavops
  labels:
    app: utsavops-checkout
    tier: critical
spec:
  replicas: 3
  selector:
    matchLabels:
      app: utsavops-checkout
  template:
    metadata:
      labels:
        app: utsavops-checkout
        tier: critical
    spec:
      containers:
      - name: checkout
        image: python:3.11-slim
        command: ["python3", "-c"]
        args:
        - |
          import http.server, socketserver
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"status":"healthy","service":"utsavops-checkout"}')
              def log_message(self, format, *args):
                  pass
          with socketserver.TCPServer(("", 8000), Handler) as httpd:
              httpd.serve_forever()
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: utsavops-checkout
  namespace: utsavops
  labels:
    app: utsavops-checkout
spec:
  type: ClusterIP
  selector:
    app: utsavops-checkout
  ports:
  - port: 8000
    targetPort: 8000
